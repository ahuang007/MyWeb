<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飞机大战</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../index.html" class="back-link">← 返回首页</a>
    <div class="container">
        <h1>飞机大战</h1>
        
        <div class="game-info">
            <div class="score-board">
                <span class="label">得分</span>
                <span id="score" class="value">0</span>
            </div>
            <div class="score-board">
                <span class="label">最高分</span>
                <span id="highScore" class="value">0</span>
            </div>
            <div class="score-board health-board">
                <span class="label">己方血量</span>
                <div class="health-bar">
                    <div class="health-fill" id="health-fill"></div>
                </div>
                <span id="lives" class="value">6</span>
            </div>
            <div class="score-board">
                <span class="label">关卡</span>
                <span id="level" class="value">1</span>
            </div>
            <button id="start-btn" class="btn btn-primary">开始游戏</button>
        </div>
        
        <div class="game-wrapper">
            <canvas id="gameCanvas"></canvas>
            <div id="game-over" class="game-over hidden">
                <h2>游戏结束</h2>
                <p>最终得分: <span id="final-score">0</span></p>
                <button id="restart-btn" class="btn btn-primary">再玩一次</button>
            </div>
            <div id="game-start" class="game-start">
                <h2>飞机大战</h2>
                <p>方向键或WASD移动，空格键发射</p>
                <p>击落敌机得分，避免被击中</p>
                <button id="play-btn" class="btn btn-primary">开始</button>
            </div>
        </div>
        
        <div class="instructions">
            <h3>操作说明</h3>
            <p>← → ↑ ↓ 或 WASD：移动飞机</p>
            <p>空格键：发射子弹</p>
            <p>击落敌机得分，被敌机或子弹击中会失去生命</p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
