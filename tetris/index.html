<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>俄罗斯方块</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../index.html" class="back-link">← 返回首页</a>
    <div class="container">
        <h1>俄罗斯方块</h1>
        
        <div class="game-wrapper">
            <div class="game-info">
                <div class="info-panel">
                    <div class="score-board">
                        <div class="score-item">
                            <span class="label">得分</span>
                            <span id="score" class="value">0</span>
                        </div>
                        <div class="score-item">
                            <span class="label">最高分</span>
                            <span id="highScore" class="value">0</span>
                        </div>
                        <div class="score-item">
                            <span class="label">等级</span>
                            <span id="level" class="value">1</span>
                        </div>
                        <div class="score-item">
                            <span class="label">消除行数</span>
                            <span id="lines" class="value">0</span>
                        </div>
                    </div>
                    
                    <div class="next-piece">
                        <div class="label">下一个</div>
                        <canvas id="nextCanvas" width="120" height="120"></canvas>
                    </div>
                    
                    <div class="controls-info">
                        <h3>操作说明</h3>
                        <p>← → : 左右移动</p>
                        <p>↓ : 快速下落</p>
                        <p>↑ : 旋转</p>
                        <p>空格 : 暂停</p>
                    </div>
                </div>
            </div>
            
            <div class="game-area">
                <canvas id="gameCanvas"></canvas>
                <div id="game-over" class="game-over hidden">
                    <h2>游戏结束！</h2>
                    <p>最终得分: <span id="final-score">0</span></p>
                    <button id="play-again" class="btn btn-primary">再玩一次</button>
                </div>
                <div id="game-paused" class="game-paused hidden">
                    <h2>游戏暂停</h2>
                    <p>按空格键继续</p>
                </div>
            </div>
            
            <div class="game-controls">
                <button id="start-btn" class="btn btn-primary">开始游戏</button>
                <button id="pause-btn" class="btn btn-secondary" disabled>暂停</button>
                <button id="restart-btn" class="btn btn-secondary">重新开始</button>
            </div>
            <div class="mobile-controls-bar" id="mobile-controls-bar">
                <button type="button" id="btn-left" class="ctrl-btn ctrl-left" aria-label="左移">←</button>
                <button type="button" id="btn-right" class="ctrl-btn ctrl-right" aria-label="右移">→</button>
                <button type="button" id="btn-rotate" class="ctrl-btn ctrl-rotate" aria-label="旋转">↻</button>
                <button type="button" id="btn-down" class="ctrl-btn ctrl-down" aria-label="下落">↓</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
